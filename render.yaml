# Render Blueprint for the AssistIQ Python backend.
# In Render: New > Blueprint > pick this repo. Secrets marked `sync: false` are asked for on first deploy.
services:
  - type: web
    name: assistiq-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./python-app
    dockerfilePath: ./python-app/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: https://assistiq-two.vercel.app
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_S3_BUCKET
        value: edumatebucket01
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
